<!-- Reference drawing for the Clair mark (design D1 of the design-app-icon change).
     A 100 x 100 drawing space mapped onto Icon Composer's 1024 px canvas, which is the
     icon tile itself: ring outer diameter 737 px (72% of the tile), ring centre (533, 512),
     21 px (about 2%) right of centre. Edit the mark here and in make_layers.py together,
     then regenerate the layers. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <g transform="translate(9.36 -11.64) scale(10.4727)" fill="none" stroke="#000" stroke-linecap="round">
    <!-- ring layer: ring (gap +-40 deg), curl, flick -->
    <path stroke-width="6.4" d="M74.51 29.43 A32 32 0 1 0 74.51 70.57"/>
    <path stroke-width="3.6" d="M74.51 70.57 C80.43 66.02 81.08 58.22 75.88 55.62 C71.97 53.67 68.07 56.92 70.02 60.43"/>
    <path stroke-width="3.6" d="M74.51 29.43 C77.31 27.87 79.13 25.92 79.39 23.71"/>
    <!-- inlay layer: hairline, bead -->
    <path stroke-width="2" d="M68 34.89 A23.5 23.5 0 1 0 68 65.11"/>
    <circle cx="26.5" cy="50" r="2.6" fill="#000" stroke="none"/>
  </g>
</svg>
