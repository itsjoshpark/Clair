kind: New
body: 'Settings… (Cmd+,) opens Clair''s own Settings window instead of a Chromium settings tab. General shows whether Clair is your default browser and can make it so. Advanced has the switch for dragging the window from the top of webpages, and More Settings… for search, privacy and Chromium''s other settings'
time: 2026-11-08T01:30:00.000000-05:00
