kind: New
body: 'Profiles: each Space uses a profile with its own cookies, logins, history and extensions. Choose it when creating a Space or in Manage Spaces, change it with Set Profile or Spaces › Change Profile, and add, rename or remove profiles in Settings › Profiles, where each profile also has its download location and links to its search, privacy, notification and browsing data settings. Switching to a Space of another profile stays in the same window'
time: 2026-11-13T14:10:00-05:00
