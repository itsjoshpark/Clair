kind: Changed
body: 'Copying the page''s address (Shift+Cmd+C, the URL field''s copy button or its menu) shows Arc''s "Copied Current URL" popup in the corner of the page, with a share button, and the full-screen "Press Esc" notice uses the same popup. Tooltips have key caps with depth, a softer shadow and tighter padding, a tab''s full title shows after 2 seconds, and clicking or right-clicking a control no longer brings its tooltip up. A tab''s speaker sits between its icon and title, as in Arc, and animates between playing and muted. The command bar''s border matches Arc''s, in full screen the sidebar no longer flickers darker when the pointer moves over it, and tooltips, popups, the URL field and the command bar match Arc in Dark Mode and incognito windows'
