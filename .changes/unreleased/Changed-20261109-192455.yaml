kind: Changed
body: Pinned extensions are now tiles that wrap across the sidebar, as in Arc, and the extensions button is gone. The site-controls button, now on every tab including new tabs, opens a native Site Control Center with every extension, pin badges, a tile for adding more, Site Info and a menu. Popups for extensions that aren't pinned open beside it. A new Extensions menu in the menu bar lists every extension and opens its popup the same way. A red lock shows in the URL field on pages that aren't secure, extensions that are off for the tab no longer run when clicked, and a revealed sidebar stays put while the Site Control Center or downloads list is open
