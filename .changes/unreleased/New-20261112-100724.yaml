kind: New
body: 'Spaces, as in Arc: keep work, personal and project tabs apart, each Space with its own name and emoji. The sidebar shows the current Space above its tabs, and a switcher in its footer moves between Spaces with a sideways slide; Spaces › Next Space (Opt+Cmd+Right), Previous Space (Opt+Cmd+Left) and Ctrl+1 to Ctrl+9 do too. Create a Space from the footer''s plus menu or the Spaces menu, rename it, change its icon or delete it from its header''s menu, drag it in the switcher to reorder, or manage every Space at once with Manage Spaces…. A tab''s menu moves it to another Space with its page as it was. Closing a tab goes back to the tab you came from, as in Arc, and Next and Previous Tab are now Opt+Cmd+Down and Up. Clair also reopens your tabs at launch, each in its Space; "On startup" in Settings still changes that'
