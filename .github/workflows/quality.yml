# The quality checks (change 1 design D12): packages the app from the commit's
# prebuilt engine and runs the static checks and the runtime suite against it. The
# suite runs in two parallel jobs: the update tests, which wait on Sparkle and
# idle periods, and everything else. A failure on main opens or updates a
# quality-failure issue, and a later pass closes it. No release ships without
# these passing.
#
# A push to main skips the suite when a run on a commit with the same file tree
# has already passed, such as the branch run before a squash merge of an
# up-to-date branch. The run then counts as a pass.
name: Quality

on:
  push:
    branches: ["main"]
  workflow_dispatch:
    inputs:
      report_issue:
        description: "Report the result to the quality-failure issue, as a run on main does"
        required: false
        default: false
        type: boolean
  workflow_call:
    inputs:
      report_issue:
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  lookup:
    name: Look for a pass on the same tree
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      passed: ${{ steps.find.outputs.passed }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Find a passed run
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tree="$(git rev-parse 'HEAD^{tree}')"
          status=0
          url="$(./scripts/find-quality-pass.sh --tree "$tree")" || status=$?
          case "$status" in
            0) echo "::notice::Skipping the suite: $url passed on the same tree ($tree)"
               echo "passed=true" >> "$GITHUB_OUTPUT" ;;
            1) echo "No passed run on tree $tree"
               echo "passed=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::warning::Couldn't look for a passed run, so the suite runs"
               echo "passed=false" >> "$GITHUB_OUTPUT" ;;
          esac

  quality:
    name: Quality checks (${{ matrix.name }})
    needs: lookup
    if: ${{ !cancelled() && needs.lookup.outputs.passed != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: updates
            name: updates
            tests: >-
              -only-testing:ClairRuntimeTests/UpdateMenuTests
              -only-testing:ClairRuntimeTests/IdleInstallTests
          - shard: app
            name: app and window
            tests: >-
              -skip-testing:ClairRuntimeTests/UpdateMenuTests
              -skip-testing:ClairRuntimeTests/IdleInstallTests
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The build number is the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Download the engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          key="$(./scripts/engine-key.sh)"
          tag="chromium-engine-$key"
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" != false ]]; then
            echo "::error::no engine for $key. Build it with: gh workflow run engine.yml -f ref=$BRANCH"
            exit 1
          fi
          mkdir -p "$RUNNER_TEMP/engine"
          gh release download "$tag" --dir "$RUNNER_TEMP/engine"
          (cd "$RUNNER_TEMP/engine" && shasum -a 256 -c "Clair-Chromium-Engine-$key-arm64.zip.sha256")
          echo "ENGINE_ZIP=$RUNNER_TEMP/engine/Clair-Chromium-Engine-$key-arm64.zip" >> "$GITHUB_ENV"

      # package.sh builds the update's DMG with dmgbuild, which needs Python
      # 3.10 or later (scripts/fetch-dmgbuild.sh). Only dmgbuild gets it: on
      # PATH, it would also run the suite's web server, and macOS would then
      # ask whether that Python may use the local network, over Clair's alerts.
      - name: Set up Python for dmgbuild
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          update-environment: false

      - name: Package the app and build the tests
        env:
          DMGBUILD_PYTHON: ${{ steps.python.outputs.python-path }}
        run: ./tests/runtime/run.sh prepare "$ENGINE_ZIP" "$RUNNER_TEMP/engine/engine.json" "$RUNNER_TEMP/runtime"

      # The package is the same in both jobs, so one checks it.
      - name: Verify the app (no signing checks)
        if: ${{ matrix.shard == 'app' }}
        run: ./scripts/verify-app.sh --skip-signing "$RUNNER_TEMP/runtime/Clair.app"

      - name: Run the runtime suite
        env:
          TESTS: ${{ matrix.tests }}
        run: |
          read -r -a tests <<<"$TESTS"
          ./tests/runtime/run.sh test "$RUNNER_TEMP/runtime" "${tests[@]}"

      # The report job reads both jobs' failing tests from these.
      - name: Upload the failing tests
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: failures-${{ matrix.shard }}
          retention-days: 1
          if-no-files-found: ignore
          path: ${{ runner.temp }}/runtime/failures.txt

      - name: Upload the results
        if: ${{ failure() || cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: runtime-results-${{ matrix.shard }}
          retention-days: 14
          if-no-files-found: ignore
          path: |
            ${{ runner.temp }}/runtime/results.xcresult
            ${{ runner.temp }}/runtime/logs

  report:
    # Only this job can write issues.
    name: Report to the quality-failure issue
    needs: [lookup, quality]
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || inputs.report_issue) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Nothing to download when both jobs failed before the suite ran.
      - name: Download the failing tests
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: failures-*
          path: ${{ runner.temp }}/failures

      - name: Update the issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          # A skipped suite passed on the same tree.
          RESULT: ${{ needs.lookup.outputs.passed == 'true' && 'success' || needs.quality.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          find "$RUNNER_TEMP/failures" -name failures.txt -exec cat {} + > "$RUNNER_TEMP/failures.txt" 2>/dev/null || true
          ./scripts/report-quality.sh --result "$RESULT" --commit "$GITHUB_SHA" \
            --run-url "$RUN_URL" --failures "$RUNNER_TEMP/failures.txt"
