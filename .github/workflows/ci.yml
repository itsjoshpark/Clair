# The merge gate, for every push and pull request: script tests, shell script
# lint, workflow lint, and the native layer's build and unit tests. The patch check is build.yml; the engine is
# built only on the owner's Mac, by engine.yml.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script tests and lint
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install tools
        run: brew install cmark-gfm shellcheck actionlint librsvg

      - name: Run script tests
        run: |
          failures=0
          for test in scripts/*.test.sh ./package.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"

      - name: Lint shell scripts
        run: shellcheck -S warning build.sh package.sh package.test.sh scripts/*.sh .github/scripts/*.sh

      - name: Lint workflows
        run: actionlint

      - name: Check the appcast is well-formed
        run: xmllint --noout .sparkle/appcast.xml

  native:
    name: Native layer build and tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Check the project is in Xcode's JSON format
        run: |
          test -f native/ClairUI.xcodeproj/project.xcproj
          if [[ -e native/ClairUI.xcodeproj/project.pbxproj ]]; then
            echo "::error::native/ClairUI.xcodeproj has a project.pbxproj; keep only the JSON project.xcproj"
            exit 1
          fi

      - name: Build and test ClairUI (unsigned)
        run: |
          xcodebuild -project native/ClairUI.xcodeproj -scheme ClairUI \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build test
