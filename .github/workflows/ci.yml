# The merge gate, for every push and pull request: script tests, shell script
# lint, workflow lint, the native layer's build and unit tests, and the engine
# check (change 1 design D12). The engine is built only on the owner's Mac, by
# engine.yml, which re-runs the engine check once it publishes an engine.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scripts:
    name: Script tests and lint
    runs-on: xcode-27
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Install tools
        run: brew install cmark-gfm shellcheck actionlint librsvg

      # package.test.sh builds real DMGs with dmgbuild, which needs Python 3.10
      # or later (scripts/fetch-dmgbuild.sh).
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: v1.26.0

      # Every fragment must parse and have a known kind, or the release would
      # fail at its first step.
      - name: Check the Changie fragments
        run: |
          set -euo pipefail
          if compgen -G ".changes/unreleased/*.yaml" >/dev/null; then
            changie batch auto --dry-run
          else
            echo "No unreleased changes"
          fi

      - name: Install the DMG artwork tools
        run: python3 -m pip install --disable-pip-version-check -r resources/dmg/artwork-requirements.txt

      - name: Run script tests
        env:
          REQUIRE_ARTWORK_TOOLS: "1"
        run: |
          failures=0
          for test in scripts/*.test.sh ./package.test.sh; do
            echo "==> $test"
            "$test" || failures=$((failures + 1))
          done
          exit "$failures"

      - name: Lint shell scripts
        run: shellcheck -S warning build.sh package.sh package.test.sh scripts/*.sh tests/runtime/*.sh .github/scripts/*.sh

      - name: Lint workflows
        run: actionlint

      # Specs and active changes must parse, with warnings counted as errors.
      - name: Validate the OpenSpec specs and changes
        env:
          OPENSPEC_TELEMETRY: "0"
          DO_NOT_TRACK: "1"
        run: npx --yes @fission-ai/openspec@1.16.0 validate --all --strict --no-interactive

      - name: Check the appcast is well-formed
        run: xmllint --noout .sparkle/appcast.xml

  native:
    name: Native layer build and tests
    runs-on: xcode-27
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Select Xcode
        run: ./.github/scripts/select-xcode.sh

      - name: Check the project is in Xcode's JSON format
        run: |
          test -f native/ClairUI.xcodeproj/project.xcproj
          if [[ -e native/ClairUI.xcodeproj/project.pbxproj ]]; then
            echo "::error::native/ClairUI.xcodeproj has a project.pbxproj; keep only the JSON project.xcproj"
            exit 1
          fi

      - name: Build and test ClairUI (unsigned)
        run: |
          xcodebuild -project native/ClairUI.xcodeproj -scheme ClairUI \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO build test

      # Only quality.yml runs the suite, after a merge. This keeps it compiling.
      - name: Build the runtime suite
        run: |
          xcodebuild -project tests/runtime/ClairRuntimeTests.xcodeproj -scheme ClairRuntimeTests \
            -destination "platform=macOS,arch=arm64" \
            -derivedDataPath "$RUNNER_TEMP/RuntimeDerivedData" \
            -quiet build-for-testing

  engine-key:
    name: Engine key
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      key: ${{ steps.key.outputs.key }}
      changed: ${{ steps.key.outputs.changed }}
      published: ${{ steps.engine.outputs.published }}
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # The engine is built from the branch head, not the merge commit.
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Compare with the base
        id: key
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          # Each commit's key comes from its own engine-key.sh, as engine.yml
          # would compute it on that commit.
          base="$RUNNER_TEMP/base"
          git worktree add --detach --quiet "$base" "$BASE_SHA"
          key="$(./scripts/engine-key.sh)"
          base_key="$("$base/scripts/engine-key.sh" "$base")"
          echo "key=$key" >> "$GITHUB_OUTPUT"
          echo "Engine key: $key (base: $base_key)"
          if [[ "$key" == "$base_key" ]]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "::group::Changed engine inputs"
            diff <("$base/scripts/engine-key.sh" --manifest "$base") <(./scripts/engine-key.sh --manifest) || true
            echo "::endgroup::"
          fi

      - name: Look for a published engine
        id: engine
        if: ${{ steps.key.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY: ${{ steps.key.outputs.key }}
        run: |
          # If the lookup fails, the patch check runs as usual.
          draft="$(gh release view "chromium-engine-$KEY" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "chromium-engine-$KEY is published, so the patch check isn't needed."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

  patch-check:
    # Fetches the Chromium source and applies every patch and the overlay, so a
    # patch that no longer applies fails here, named in the log. It compiles no
    # Chromium. Skipped when this key's engine is already published: engine.yml
    # applied the same inputs to build it.
    name: Patch check
    needs: engine-key
    if: ${{ needs.engine-key.outputs.changed == 'true' && needs.engine-key.outputs.published != 'true' }}
    runs-on: xcode-27
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare runner
        run: ./.github/scripts/prepare-runner.sh

      - name: Fetch and patch (patch-only mode)
        run: ./build.sh fetch prepare

  engine-check:
    # The required check. A pull request that changes the engine key passes
    # only once chromium-engine-<key> is published and its patch check, if it
    # ran, passed.
    # engine.yml re-runs this job, and only this job, after publishing, so it
    # finds the job by its name and the key in its annotation.
    name: Engine check
    needs: [engine-key, patch-check]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check the engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEY_RESULT: ${{ needs.engine-key.result }}
          PATCH_RESULT: ${{ needs.patch-check.result }}
          KEY: ${{ needs.engine-key.outputs.key }}
          CHANGED: ${{ needs.engine-key.outputs.changed }}
          BRANCH: ${{ github.head_ref }}
          FORK: ${{ github.event.pull_request.head.repo.full_name != github.repository }}
        run: |
          if [[ "$KEY_RESULT" != success || ! "$KEY" =~ ^[0-9a-f]{16}$ ]]; then
            echo "::error::The engine key could not be worked out; see the Engine key job."
            exit 1
          fi
          if [[ "$CHANGED" != true ]]; then
            echo "Engine key unchanged ($KEY): this pull request needs no new engine."
            exit 0
          fi
          tag="chromium-engine-$KEY"
          echo "::notice title=Engine needed::$tag"
          # Skipped means the engine was published when this run started. The
          # lookup below still decides whether it's published now.
          if [[ "$PATCH_RESULT" != success && "$PATCH_RESULT" != skipped ]]; then
            echo "::error::The patch check did not pass ($PATCH_RESULT); see its log."
            exit 1
          fi
          draft="$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null || true)"
          if [[ "$draft" == false ]]; then
            echo "$tag is published."
            exit 0
          fi
          if [[ "$FORK" == true ]]; then
            how="push this pull request's commits to a branch of $GH_REPO, then run: gh workflow run engine.yml -f ref=<that branch>"
          else
            how="gh workflow run engine.yml -f ref=$BRANCH"
          fi
          echo "::error::$tag is not published. This pull request changes the engine, so it can't merge until the owner builds it: $how"
          exit 1
