# Publishes a release of Clair (change 1 design D5, D6, D11). Started by hand from
# main, after adding Changie fragments (.changes/README.md):
#
#   gh workflow run release.yml -f release-type=auto
#   gh workflow run release.yml -f release-type=auto -f dry-run=true
#
# It works out the version, makes sure the commit has an engine and passing quality
# checks, then packages, signs and notarizes the app. A dry run stops there, with
# the DMG as a workflow artifact and nothing changed. See docs/releasing.md.
name: Release

on:
  workflow_dispatch:
    inputs:
      release-type:
        description: "Release type: auto (from the Changie fragments), patch, minor or major"
        required: true
        default: auto
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
      dry-run:
        description: "Package and notarize only: no tag, Release or appcast change"
        required: false
        default: false
        type: boolean

permissions:
  contents: read

# Two runs would work out the same version and build number.
concurrency:
  group: release
  cancel-in-progress: false

env:
  CHANGIE_VERSION: v1.26.0

jobs:
  validate:
    name: Validate
    runs-on: [self-hosted, clair-release]
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.preflight.outputs.version }}
      build: ${{ steps.preflight.outputs.build }}
      tag: ${{ steps.preflight.outputs.tag }}
      key: ${{ steps.engine.outputs.key }}
      engine_published: ${{ steps.engine.outputs.published }}
      quality_passed: ${{ steps.quality.outputs.passed }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          # Not the workspace root, which holds the persistent engine workspace.
          path: release
          # The build number is the commit count.
          fetch-depth: 0
          persist-credentials: false

      - name: Use Homebrew's tools
        working-directory: .
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: ${{ env.CHANGIE_VERSION }}

      - name: Run the preflight checks
        id: preflight
        env:
          RELEASE_TYPE: ${{ inputs.release-type }}
        run: |
          if [[ "$GITHUB_REF" != refs/heads/main ]]; then
            echo "::error::Releases run from main, not $GITHUB_REF_NAME. Only main can reach the release secrets."
            exit 1
          fi
          # No pipe into tee: the default shell has no pipefail, so a refusal would pass.
          ./scripts/release-preflight.sh --release-type "$RELEASE_TYPE" >"$RUNNER_TEMP/preflight.txt"
          cat "$RUNNER_TEMP/preflight.txt"
          cat "$RUNNER_TEMP/preflight.txt" >> "$GITHUB_OUTPUT"

      - name: Look for the commit's engine
        id: engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          key="$(./scripts/engine-key.sh)"
          draft="$(gh release view "chromium-engine-$key" --json isDraft --jq .isDraft 2>/dev/null || true)"
          published=false
          [[ "$draft" != false ]] || published=true
          echo "Engine $key published: $published"
          {
            echo "key=$key"
            echo "published=$published"
          } >> "$GITHUB_OUTPUT"

      - name: Look for the commit's quality checks
        id: quality
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          passes="$(gh run list --workflow quality.yml --commit "$GITHUB_SHA" --status success --limit 1 --json databaseId --jq length)"
          passed=false
          (( passes == 0 )) || passed=true
          echo "Quality checks already passed for ${GITHUB_SHA:0:7}: $passed"
          echo "passed=$passed" >> "$GITHUB_OUTPUT"

  engine:
    name: Engine
    needs: validate
    if: ${{ needs.validate.outputs.engine_published == 'false' }}
    uses: ./.github/workflows/engine.yml
    # What engine.yml's jobs ask for: no job here can reach the release secrets.
    permissions:
      contents: write
      actions: write
      checks: read
      pull-requests: read
    with:
      ref: ${{ github.ref_name }}

  quality:
    name: Quality
    needs: [validate, engine]
    if: ${{ !cancelled() && needs.validate.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.engine.result) && needs.validate.outputs.quality_passed == 'false' }}
    uses: ./.github/workflows/quality.yml
    # What quality.yml's jobs ask for. It reports to no issue from here.
    permissions:
      contents: read
      issues: write

  package:
    name: Package
    needs: [validate, engine, quality]
    if: ${{ !cancelled() && needs.validate.result == 'success' && contains(fromJSON('["success", "skipped"]'), needs.engine.result) && contains(fromJSON('["success", "skipped"]'), needs.quality.result) }}
    runs-on: [self-hosted, clair-release]
    environment: release
    timeout-minutes: 240
    env:
      VERSION: ${{ needs.validate.outputs.version }}
      BUILD: ${{ needs.validate.outputs.build }}
      KEY: ${{ needs.validate.outputs.key }}
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: release
          persist-credentials: false

      - name: Set paths
        working-directory: .
        run: |
          echo /opt/homebrew/bin >> "$GITHUB_PATH"
          {
            echo "KEYCHAIN=$RUNNER_TEMP/clair-signing.keychain-db"
            echo "SEARCH_LIST=$RUNNER_TEMP/keychain-search-list"
            echo "AC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8"
            echo "ENGINE_DIR=$RUNNER_TEMP/engine"
            echo "PACKAGE_DIR=$RUNNER_TEMP/package"
            echo "DIST=$RUNNER_TEMP/dist"
          } >> "$GITHUB_ENV"

      - name: Create the signing keychain
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: ./scripts/release-keychain.sh create "$KEYCHAIN" "$SEARCH_LIST"

      - name: Prepare the App Store Connect API key
        env:
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
        run: |
          (umask 077 && printf '%s' "$AC_API_KEY_P8_BASE64" | base64 -D >"$AC_KEY_PATH")
          [[ -s "$AC_KEY_PATH" ]] || { echo "::error::AC_API_KEY_P8_BASE64 decoded to an empty file"; exit 1; }

      - name: Check the credentials
        id: credentials
        env:
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          ./scripts/check-release-credentials.sh --keychain "$KEYCHAIN" --key "$AC_KEY_PATH" \
            --key-id "$AC_API_KEY_ID" --issuer "$AC_API_ISSUER_ID" >> "$GITHUB_OUTPUT"

      - name: Download the engine
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mkdir -p "$ENGINE_DIR"
          gh release download "chromium-engine-$KEY" --dir "$ENGINE_DIR"
          (cd "$ENGINE_DIR" && shasum -a 256 -c "Clair-Chromium-Engine-$KEY-arm64.zip.sha256")

      - name: Package, sign and notarize
        env:
          IDENTITY: ${{ steps.credentials.outputs.identity }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
        run: |
          ./package.sh --version "$VERSION" --build "$BUILD" \
            --identity "$IDENTITY" --keychain "$KEYCHAIN" \
            --notary-key "$AC_KEY_PATH" --notary-key-id "$AC_API_KEY_ID" --notary-issuer "$AC_API_ISSUER_ID" \
            "$ENGINE_DIR/Clair-Chromium-Engine-$KEY-arm64.zip" "$PACKAGE_DIR"

      - name: Verify the package
        run: ./scripts/verify-app.sh --version "$VERSION" --dmg "$PACKAGE_DIR/Clair-$VERSION-arm64.dmg" "$PACKAGE_DIR/Clair.app"

      - name: Make the deltas and sign every asset
        env:
          GH_TOKEN: ${{ github.token }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          REPO: ${{ github.repository }}
        run: |
          mkdir -p "$DIST"
          ./scripts/make-deltas.sh --app "$PACKAGE_DIR/Clair.app" --dmg "$PACKAGE_DIR/Clair-$VERSION-arm64.dmg" \
            --version "$VERSION" --build "$BUILD" --out "$DIST" --repo "$REPO" >"$DIST/assets.txt"
          cat "$DIST/assets.txt"
          mv "$PACKAGE_DIR/Clair-$VERSION-arm64.dmg" "$DIST/"

      - name: Upload the release
        uses: actions/upload-artifact@v7
        with:
          name: clair-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dist
          if-no-files-found: error
          retention-days: 14
          # DMGs and deltas are already compressed.
          compression-level: 0

      - name: Remove the credentials
        if: ${{ always() }}
        run: |
          status=0
          ./scripts/release-keychain.sh delete "$KEYCHAIN" "$SEARCH_LIST" || status=$?
          rm -rf "$AC_KEY_PATH" "$ENGINE_DIR" "$PACKAGE_DIR" "$DIST"
          exit "$status"

  publish:
    name: Publish
    needs: [validate, package]
    if: ${{ !cancelled() && needs.package.result == 'success' && !inputs.dry-run }}
    runs-on: [self-hosted, clair-release]
    # For the deploy key, the one thing allowed to push past main's required checks.
    environment: release
    timeout-minutes: 60
    permissions:
      contents: write
    defaults:
      run:
        working-directory: release
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          path: release
          fetch-depth: 0
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      # The runner runs as the owner, whose SSH config offers the owner's own key
      # before checkout's deploy key. A push as the owner is refused by main's ruleset
      # (0.1.0's publish), so git's ssh ignores that config and uses only the deploy key.
      - name: Push with the deploy key only
        run: |
          ssh_command="$(git config --local core.sshCommand)" ||
            { echo "::error::actions/checkout configured no SSH command for the deploy key"; exit 1; }
          ssh_command="$ssh_command -F /dev/null -o IdentitiesOnly=yes -o IdentityAgent=none"
          git config --local core.sshCommand "$ssh_command"
          # ssh -T always fails; its greeting names the deploy key's repository, or a user.
          greeting="$(eval "$ssh_command -T git@github.com" 2>&1 || true)"
          echo "$greeting"
          if [[ "$greeting" != *"Hi $GITHUB_REPOSITORY!"* ]]; then
            echo "::error::GitHub doesn't see the deploy key for $GITHUB_REPOSITORY, so main's ruleset would refuse the push. Nothing was published."
            exit 1
          fi

      - name: Use Homebrew's tools
        working-directory: .
        run: echo /opt/homebrew/bin >> "$GITHUB_PATH"

      - name: Install Changie
        uses: miniscruff/changie-action@v3
        with:
          version: ${{ env.CHANGIE_VERSION }}

      - name: Download the release
        uses: actions/download-artifact@v7
        with:
          name: clair-${{ needs.validate.outputs.version }}
          path: ${{ runner.temp }}/dist

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          REPO: ${{ github.repository }}
          VERSION: ${{ needs.validate.outputs.version }}
          BUILD: ${{ needs.validate.outputs.build }}
          KEY: ${{ needs.validate.outputs.key }}
        run: |
          gh release download "chromium-engine-$KEY" --pattern engine.json --dir "$RUNNER_TEMP"
          ./scripts/publish-release.sh --version "$VERSION" --build "$BUILD" --base "$GITHUB_SHA" \
            --dist "$RUNNER_TEMP/dist" --ungoogled "$(jq -r .ungoogled_chromium "$RUNNER_TEMP/engine.json")" \
            --engine-key "$KEY" --repo "$REPO"

      - name: Remove the release files
        if: ${{ always() }}
        run: rm -rf "$RUNNER_TEMP/dist" "$RUNNER_TEMP/engine.json"
