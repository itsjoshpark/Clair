# One link in Clair's chained build. Restores the build directory left by the
# previous job, compiles until shortly before GitHub's 6-hour job limit, and
# hands the directory to the next job. The job that finishes the build runs the
# smoke test and uploads the unsigned app.
name: Build phase

on:
  workflow_call:
    inputs:
      phase:
        description: "Phase number, used in job names and logs"
        required: true
        type: number
      configure:
        description: "Run the configure stage before compiling (first phase only)"
        required: false
        type: boolean
        default: false
    outputs:
      status:
        description: "running (resume in the next phase) or finished"
        value: ${{ jobs.compile.outputs.status }}

permissions:
  contents: read

jobs:
  compile:
    name: Compile (phase ${{ inputs.phase }})
    runs-on: macos-26
    timeout-minutes: 360
    outputs:
      status: ${{ steps.compile.outputs.status }}
    steps:
      - name: Record job start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare runner
        run: ./.github/scripts/prepare-runner.sh

      - name: Download build directory
        uses: actions/download-artifact@v8
        with:
          name: clair-build-dir
          path: build_artifact

      - name: Unpack build directory
        run: ./.github/scripts/unpack-build.sh build_artifact

      - name: Configure
        if: ${{ inputs.configure }}
        # Pull request builds use the light settings in flags.pr.gn.
        run: ./build.sh -l configure

      - name: Compile
        id: compile
        run: |
          # Leave about an hour for setup before this step and for packing and
          # uploading after it.
          remaining=$(( 360*60 - 60*60 - ($(date +%s) - JOB_START) ))
          # Three jobs, one per core, keep compiles within the runner's 7 GB.
          ./build.sh -j 3 -t "$remaining" compile
          echo "status=$(cat build/compile_status)" >> "$GITHUB_OUTPUT"
          echo "Phase ${{ inputs.phase }}: $(cat build/compile_status)"

      - name: Pack build directory
        if: ${{ steps.compile.outputs.status == 'running' }}
        run: ./.github/scripts/pack-build.sh upload_build

      - name: Upload build directory for the next phase
        if: ${{ steps.compile.outputs.status == 'running' }}
        uses: actions/upload-artifact@v7
        with:
          name: clair-build-dir
          path: upload_build/
          overwrite: true
          retention-days: 2
          compression-level: 0

      - name: Smoke test
        if: ${{ steps.compile.outputs.status == 'finished' }}
        run: ./.github/scripts/smoke-test.sh upload_app

      - name: Check that the build left the work tree clean
        if: ${{ steps.compile.outputs.status == 'finished' }}
        run: |
          if [[ -n "$(git status --porcelain)" ]]; then
            echo "::error::The build left untracked or modified files in the repository:"
            git status --porcelain
            exit 1
          fi

      - name: Upload unsigned app
        if: ${{ steps.compile.outputs.status == 'finished' }}
        uses: actions/upload-artifact@v7
        with:
          name: clair-unsigned-app
          path: upload_app/
          retention-days: 7
