# The patch check (change 1 design D12): fetches the Chromium source and
# applies every patch on a GitHub-hosted runner, so a patch that no longer
# applies fails here, named in the log. Chromium itself is compiled only on the
# owner's Mac, by engine.yml.
name: Patch check

on:
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "openspec/**"
      - ".sparkle/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    name: Fetch and patch source
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - name: Check out
        uses: actions/checkout@v7
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Prepare runner
        run: ./.github/scripts/prepare-runner.sh

      - name: Fetch and patch (patch-only mode)
        run: ./build.sh fetch prepare
