# Reports whether each secret of the `release` environment is set, without
# printing any value (task 7.1). It runs on the owner's Mac because release
# secrets reach only that machine (D6, D11), and only from `main`, the one branch
# the environment allows. Start the runner, then run
# `gh workflow run release-secrets-check.yml`.
name: Release secrets check

on:
  workflow_dispatch:

permissions: {}

jobs:
  check:
    name: Check the release secrets
    runs-on: [self-hosted, clair-release]
    environment: release
    timeout-minutes: 5
    steps:
      - name: Report each secret as present or missing
        shell: bash
        env:
          DEVELOPER_ID_CERT_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERT_P12_BASE64 }}
          DEVELOPER_ID_CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
          AC_API_KEY_P8_BASE64: ${{ secrets.AC_API_KEY_P8_BASE64 }}
          AC_API_KEY_ID: ${{ secrets.AC_API_KEY_ID }}
          AC_API_ISSUER_ID: ${{ secrets.AC_API_ISSUER_ID }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
          RELEASE_DEPLOY_KEY: ${{ secrets.RELEASE_DEPLOY_KEY }}
        run: |
          set -u
          set +x
          missing=0
          for name in DEVELOPER_ID_CERT_P12_BASE64 DEVELOPER_ID_CERT_PASSWORD AC_API_KEY_P8_BASE64 \
                      AC_API_KEY_ID AC_API_ISSUER_ID SPARKLE_ED_PRIVATE_KEY RELEASE_DEPLOY_KEY; do
            if [[ -n "${!name:-}" ]]; then
              echo "$name: present"
            else
              echo "::error::$name: missing"
              missing=$((missing + 1))
            fi
          done
          echo "$missing secret(s) missing"
          (( missing == 0 ))
