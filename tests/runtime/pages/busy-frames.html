<!doctype html>
<title>Clair busy frames page</title>
<p>An iframe that reloads every 500 ms once the page has loaded.</p>
<iframe id="frame" src="/slow-frame" width="300" height="100"></iframe>
<script>
  window.addEventListener("load", () => {
    const frame = document.getElementById("frame");
    setInterval(() => { frame.src = "/slow-frame?" + Date.now(); }, 500);
  });
</script>
