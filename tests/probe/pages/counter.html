<!doctype html>
<meta charset="utf-8">
<title>Probe counter</title>
<style>
  body { margin: 0; font: 48px -apple-system, sans-serif; background: #2b6fd6; color: #fff; }
  main { padding: 60px; }
</style>
<script>
  // share-tabs-across-windows: a page whose state shows that a tab kept it,
  // titled by its query so each tab's row can be told apart.
  window.counter = 0;
  document.title = "Counter " + (location.search.slice(1) || "page");
</script>
<main>
  <h1 id="title"></h1>
  <button id="count" style="font-size: 32px" onclick="window.counter++; show()">Count</button>
  <p id="value">0</p>
</main>
<script>
  function show() { document.getElementById("value").textContent = window.counter; }
  document.getElementById("title").textContent = document.title;
</script>
